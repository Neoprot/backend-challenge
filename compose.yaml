name: wagering-dev
services:
  api:
    image: wagering-processor:local
    build: .
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://wager_app:local-app-only@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OIDC_ISSUER: http://localhost:8180/realms/wagering
      OIDC_AUDIENCE: wagering-api
      OIDC_JWKS_URI: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      PORT: "3000"
      REQUEST_QUEUE_URL: http://localstack:4566/queue/us-east-1/000000000000/wager-transactions.fifo
      REQUEST_DLQ_URL: http://localstack:4566/queue/us-east-1/000000000000/wager-transactions-dlq.fifo
      EVENT_QUEUE_URL: http://localstack:4566/queue/us-east-1/000000000000/wager-events.fifo
    ports:
      - target: 3000
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3000/health/ready'); process.exit(response.ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  migrator:
    image: wagering-processor:local
    build: .
    profiles: ["tools"]
    command: ["bun", "scripts/migrate.ts", "up"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://wager_migrator:local-migrator-only@postgres:5432/wagering
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: local-bootstrap-only
      POSTGRES_DB: wagering
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  localstack:
    image: localstack/localstack:4.11.1
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports: ["127.0.0.1:4566:4566"]
    volumes:
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/10-queues.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "wager-events.fifo"]
      interval: 3s
      timeout: 5s
      retries: 40
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identity
      KC_DB_USERNAME: identity_owner
      KC_DB_PASSWORD: local-identity-only
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q \"200 OK\"'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
volumes:
  postgres-data:
